[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  # TINA_PUBLIC_CLIENT_ID is intentionally embedded in the pre-built admin bundle (it's a public key)
  SECRETS_SCAN_OMIT_KEYS = "TINA_PUBLIC_CLIENT_ID"

[dev]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
