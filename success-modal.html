<!-- success-modal.html -->
<div id="success-modal" class="modal" onclick="closeModal()">
    <div class="modal-content">
      <span class="close" id="closeButton">&times;</span>
      <div class="modal-icon">
        <div class="check-mark">
          <div class="ellipse ellipse1"></div>
          <div class="ellipse ellipse2"></div>
          <div class="ellipse ellipse3"></div>
          <img src="images/search 4.png" alt="check icon" />
        </div>
      </div>
      <div class="modal-text">
        <h2>Your Booking was successful</h2>
        <p>
          Thanks for booking a trip. We will share with you all the trip
          details in your registered email address.
        </p>
      </div>
    </div>
</div>

<script src="/form-validation.js"></script>
